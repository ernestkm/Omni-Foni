#!KAMAILIO
# Omni-Foní SIP edge: signaling in Kamailio, policy/charging in Go.
# The edge asks sipedge on every INVITE and BYE; sipedge calls switching's
# HTTP facade and ends orphaned dialogs via dlg.end_dlg.

debug=2
log_stderror=yes
fork=yes
children=4
tcp_accept_no_cl=yes
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "pv.so"
loadmodule "rr.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xhttp.so"
loadmodule "jsonrpcs.so"
loadmodule "http_async_client.so"
loadmodule "dialog.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"

modparam("jsonrpcs", "transport", 1)
modparam("http_async_client", "workers", 2)
modparam("http_async_client", "connection_timeout", 3000)
modparam("dialog", "default_timeout", 7200)
modparam("registrar", "default_expires", 300)

request_route {
	# Registration stub: in-memory usrloc, nothing consumes it.
	if (is_method("REGISTER")) {
		save("location");
		exit;
	}

	# Sequential requests (BYE/ACK/re-INVITE) belong to an existing dialog.
	if (has_totag()) {
		route(WITHINDLG);
		exit;
	}

	if (is_method("CANCEL")) {
		$http_req(all) = $null;
		$http_req(method) = "POST";
		$http_req(body) = "BYE " + $ci;
		http_async_query("http://sipedge:50071/bye", "IGNORE_REPLY");
		t_relay();
		exit;
	}

	if (!is_method("INVITE")) {
		sl_send_reply("405", "Method Not Allowed");
		exit;
	}

	route(EDGE);
	exit;
}

# Ask the policy adapter before relaying. sipedge returns the relay target as
# the HTTP body on 200; policy denials are 403; outages are 503.
route[EDGE] {
	dlg_manage();
	t_newtran();
	$http_req(all) = $null;
	$http_req(method) = "POST";
	$http_req(body) = $ci + "|" + $si + "|" + $fU + "|" + $tU + "|" + $rU + "|" + $dlg(h_entry) + "|" + $dlg(h_id);
	http_async_query("http://sipedge:50071/invite", "EDGE_REPLY");
	exit;
}

route[EDGE_REPLY] {
	if (!$http_ok) {
		t_reply("503", "policy unavailable");
		exit;
	}
	if ($http_rs == "200") {
		$du = $http_rb;
		record_route();
		t_relay();
		exit;
	}
	if ($http_rs == "403") {
		t_reply("403", "denied");
		exit;
	}
	t_reply("503", "policy unavailable");
	exit;
}

# In-dialog: report the end to sipedge, then relay.
route[WITHINDLG] {
	if (is_method("BYE")) {
		$http_req(all) = $null;
		$http_req(method) = "POST";
		$http_req(body) = "BYE " + $ci;
		http_async_query("http://sipedge:50071/bye", "IGNORE_REPLY");
	}
	t_relay();
	exit;
}

route[IGNORE_REPLY] {
	exit;
}

# jsonrpcs over HTTP: dlg.end_dlg for the sipedge reaper.
event_route[xhttp:request] {
	if (!($si =~ "^(127\\.|172\\.)")) {
		xhttp_reply("403", "Forbidden", "text/plain", "no");
		exit;
	}
	if ($hu =~ "^/RPC") {
		jsonrpc_dispatch();
	} else {
		xhttp_reply("404", "Not Found", "text/plain", "no");
	}
}
