name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Start data layer
        run: docker compose up -d --wait
      - name: Go tests
        run: make test
      - name: Smoke test
        run: bash ops/smoke.sh
