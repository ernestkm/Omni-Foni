services:
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:16686/ || exit 1"]
      interval: 5s
      retries: 10

  catalogue:
    build:
      context: ./services
      dockerfile: catalogue/Dockerfile
    environment:
      CATALOGUE_DSN: postgres://postgres:dev-only@postgres:5432/catalogue
      CATALOGUE_ADDR: ":50053"
      CATALOGUE_REFLECTION: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OBS_SAMPLE_RATIO: "1.0"
    ports:
      - "50053:50053"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: dev-only
      POSTGRES_DB: omnifoni
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 15

  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    environment:
      CLICKHOUSE_USER: omnifoni
      CLICKHOUSE_PASSWORD: dev-only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      retries: 10

  charging:
    build:
      context: ./services
      dockerfile: charging/Dockerfile
    environment:
      CHARGING_DSN: postgres://postgres:dev-only@postgres:5432/charging
      CHARGING_ADDR: ":50051"
      CHARGING_REFLECTION: "1"
      CHARGING_CATALOGUE_ADDR: catalogue:50053
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OBS_SAMPLE_RATIO: "1.0"
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      catalogue:
        condition: service_started

  switching:
    build:
      context: ./services
      dockerfile: switching/Dockerfile
    environment:
      SWITCHING_CHARGING_ADDR: charging:50051
      SWITCHING_ROUTING_ADDR: routing:50057
      SWITCHING_SBC_ADDR: sbc:50058
      SWITCHING_KAFKA: kafka:9092
      SWITCHING_ADDR: ":50052"
      SWITCHING_HTTP_ADDR: ":50070"
      SWITCHING_REFLECTION: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OBS_SAMPLE_RATIO: "1.0"
    ports:
      - "50052:50052"
    depends_on:
      - charging
      - routing
      - sbc

  mediation:
    build:
      context: ./services
      dockerfile: mediation/Dockerfile
    environment:
      MEDIATION_DSN: postgres://postgres:dev-only@postgres:5432/mediation
      MEDIATION_KAFKA: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OBS_SAMPLE_RATIO: "1.0"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  billing:
    build:
      context: ./services
      dockerfile: billing/Dockerfile
    environment:
      BILLING_DSN: postgres://postgres:dev-only@postgres:5432/billing
      BILLING_KAFKA: kafka:9092
      BILLING_CATALOGUE_ADDR: catalogue:50053
      BILLING_ADDR: ":50054"
      BILLING_REFLECTION: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OBS_SAMPLE_RATIO: "1.0"
    ports:
      - "50054:50054"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      catalogue:
        condition: service_started

  payments:
    build:
      context: ./services
      dockerfile: payments/Dockerfile
    environment:
      PAYMENTS_DSN: postgres://postgres:dev-only@postgres:5432/payments
      PAYMENTS_ADDR: ":50055"
      PAYMENTS_GRPC_ADDR: ":50060"
      PAYMENTS_WEBHOOK_SECRET: dev-only
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OBS_SAMPLE_RATIO: "1.0"
    ports:
      - "50055:50055"
      - "50060:50060"
    depends_on:
      postgres:
        condition: service_healthy

  identity:
    build:
      context: ./services
      dockerfile: identity/Dockerfile
    environment:
      IDENTITY_DSN: postgres://postgres:dev-only@postgres:5432/identity
      IDENTITY_ADDR: ":50056"
      IDENTITY_BILLING_ADDR: billing:50054
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OBS_SAMPLE_RATIO: "1.0"
    ports:
      - "50056:50056"
    depends_on:
      postgres:
        condition: service_healthy
      billing:
        condition: service_started

  routing:
    build:
      context: ./services
      dockerfile: routing/Dockerfile
    environment:
      ROUTING_DSN: postgres://postgres:dev-only@postgres:5432/routing
      ROUTING_ADDR: ":50057"
      ROUTING_REFLECTION: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OBS_SAMPLE_RATIO: "1.0"
    ports:
      - "50057:50057"
    depends_on:
      postgres:
        condition: service_healthy

  sbc:
    build:
      context: ./services
      dockerfile: sbc/Dockerfile
    environment:
      SBC_DSN: postgres://postgres:dev-only@postgres:5432/sbc
      SBC_ADDR: ":50058"
      SBC_REFLECTION: "1"
      SBC_FRAUD_ADDR: fraud:50063
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OBS_SAMPLE_RATIO: "1.0"
    ports:
      - "50058:50058"
    depends_on:
      postgres:
        condition: service_healthy
      fraud:
        condition: service_started

  fraud:
    build:
      context: ./services
      dockerfile: fraud/Dockerfile
    environment:
      FRAUD_DSN: postgres://postgres:dev-only@postgres:5432/fraud
      FRAUD_ADDR: ":50063"
      FRAUD_REFLECTION: "1"
      FRAUD_KAFKA: kafka:9092
      FRAUD_TOPIC_ALERTS: fraud.alerts
      FRAUD_ALERT_THRESHOLD: "60"
      FRAUD_SOFT_ACCOUNT_CALLS: "5"
      FRAUD_SOFT_PREFIX_CALLS: "2"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OBS_SAMPLE_RATIO: "1.0"
    ports:
      - "50063:50063"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  reconciliation:
    build:
      context: ./services
      dockerfile: reconciliation/Dockerfile
    environment:
      BILLING_ADDR: billing:50054
      PAYMENTS_ADDR: payments:50060
      RECONCILIATION_KAFKA: kafka:9092
      RECONCILIATION_ADDR: ":50059"
      RECONCILIATION_SWEEP_INTERVAL: 15m
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OBS_SAMPLE_RATIO: "1.0"
    ports:
      - "50059:50059"
    depends_on:
      billing:
        condition: service_started
      payments:
        condition: service_started

  reports:
    build:
      context: ./services
      dockerfile: reports/Dockerfile
    environment:
      REPORTS_CLICKHOUSE: clickhouse://omnifoni:dev-only@clickhouse:9000
      REPORTS_KAFKA: kafka:9092
      REPORTS_CATALOGUE_ADDR: catalogue:50053
      REPORTS_IDENTITY_ADDR: http://identity:50056
      REPORTS_PAYMENTS_ADDR: payments:50060
      REPORTS_CHARGING_ADDR: charging:50051
      REPORTS_SWITCHING_ADDR: switching:50052
      REPORTS_SCHED_DSN: postgres://postgres:dev-only@postgres:5432/reports_sched
      REPORTS_SCHED_TOPIC: report.ready
      REPORTS_ARTIFACT_SIGNING_SECRET: dev-only
      REPORTS_SIGNED_URL_TTL: "86400000"
      REPORTS_PUBLIC_BASE_URL: http://localhost:50062
      REPORTS_ADDR: ":50061"
      REPORTS_HTTP_ADDR: ":50062"
      REPORTS_REFLECTION: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OBS_SAMPLE_RATIO: "1.0"
    ports:
      - "50061:50061"
      - "50062:50062"
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      catalogue:
        condition: service_started
      identity:
        condition: service_started
      payments:
        condition: service_started
      charging:
        condition: service_started
      switching:
        condition: service_started

  sipedge:
    build:
      context: ./services
      dockerfile: sipedge/Dockerfile
    environment:
      SIPEDGE_SHIM_ADDR: ":50071"
      SIPEDGE_SWITCHING_HTTP: "http://switching:50070"
      SIPEDGE_KAMAILIO_RPC: "http://kamailio:5060/RPC"
      SIPEDGE_TRUNK_ACCOUNTS: "172.28.0.1=acc-sip-smoke"
      SIPEDGE_REAP_INTERVAL: "1s"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    depends_on:
      switching:
        condition: service_started
    networks: [default, sip]

  kamailio:
    image: ghcr.io/kamailio/kamailio:5.8.3-bookworm
    volumes:
      - ./ops/kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    depends_on:
      - sipedge
    networks: [sip]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --post-data='{\"jsonrpc\":\"2.0\",\"method\":\"core.uptime\",\"id\":1}' --header='Content-Type: application/json' http://127.0.0.1:5060/RPC"]
      interval: 10s
      retries: 10

  sipuas:
    build:
      context: ./services
      dockerfile: sipedge/Dockerfile
    entrypoint: ["/sipuas"]
    environment:
      SIPUAS_ADDR: ":5060"
    networks: [sip]

volumes:
  pgdata:
  valkeydata:
  chdata:

networks:
  sip:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
