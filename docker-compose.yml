services:
  catalogue:
    build: ./services/catalogue
    environment:
      CATALOGUE_DSN: postgres://postgres:dev-only@postgres:5432/catalogue
      CATALOGUE_ADDR: ":50053"
      CATALOGUE_REFLECTION: "1"
    ports:
      - "50053:50053"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: dev-only
      POSTGRES_DB: omnifoni
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 15

  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    environment:
      CLICKHOUSE_USER: omnifoni
      CLICKHOUSE_PASSWORD: dev-only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      retries: 10

  charging:
    build:
      context: ./services
      dockerfile: charging/Dockerfile
    environment:
      CHARGING_DSN: postgres://postgres:dev-only@postgres:5432/charging
      CHARGING_ADDR: ":50051"
      CHARGING_REFLECTION: "1"
      CHARGING_CATALOGUE_ADDR: catalogue:50053
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      catalogue:
        condition: service_started

  payments:
    build: ./services/payments
    environment:
      PAYMENTS_DSN: postgres://postgres:dev-only@postgres:5432/payments
      PAYMENTS_ADDR: ":50055"
      PAYMENTS_WEBHOOK_SECRET: dev-only
    ports:
      - "50055:50055"
    depends_on:
      postgres:
        condition: service_healthy

  switching:
    build:
      context: ./services
      dockerfile: switching/Dockerfile
    environment:
      SWITCHING_CHARGING_ADDR: charging:50051
      SWITCHING_KAFKA: kafka:9092
      SWITCHING_ADDR: ":50052"
      SWITCHING_REFLECTION: "1"
    ports:
      - "50052:50052"
    depends_on:
      - charging

  mediation:
    build: ./services/mediation
    environment:
      MEDIATION_DSN: postgres://postgres:dev-only@postgres:5432/mediation
      MEDIATION_KAFKA: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  billing:
    build:
      context: ./services
      dockerfile: billing/Dockerfile
    environment:
      BILLING_DSN: postgres://postgres:dev-only@postgres:5432/billing
      BILLING_KAFKA: kafka:9092
      BILLING_CATALOGUE_ADDR: catalogue:50053
      BILLING_ADDR: ":50054"
      BILLING_REFLECTION: "1"
    ports:
      - "50054:50054"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      catalogue:
        condition: service_started

volumes:
  pgdata:
  valkeydata:
  chdata:
